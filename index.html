<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>芸 My Princess ♡</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
        135deg, #fff7ef, #ecd3d7
    );
    font-family: sans-serif;
    color: #a86c7c;
    padding: 24px;
}
.card {
    width: 100%;
    max-width: 360px;
    background: #fff9f6;
    border-radius: 28px;
    padding: 36px 24px;
    text-align: center;
    box-shadow: 0 15px 45px #b7858e33;
}
h1 { font-size: 30px; }
p { line-height: 1.8; }
input {
    width: 100%;
    padding: 15px;
    border: 1px solid #dfb8c1;
    border-radius: 14px;
    font-size: 16px;
    background: white;
    margin: 15px 0;
}
button {
    width: 100%;
    border: none;
    border-radius: 30px;
    padding: 15px;
    background: #bc8191;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
button:disabled { opacity: .6; }
#message {
    font-size: 14px;
    min-height: 24px;
}
</style>
</head>
<body>
<div class="card">
    <div style="font-size:42px">♡</div>
    <h1>芸 My Princess</h1>
    <p>藏在時光裡的我們</p>
    <p>有些回憶，只屬於我們。<br>
    請輸入專屬密碼，開啟幸福日記。</p>
    <form id="unlockForm">
        <input id="password"
        type="password"
        placeholder="請輸入專屬密碼"
        autocomplete="off" required>
        <button id="unlockButton" type="submit">
            開啟我們的回憶 ♡
        </button>
    </form>
    <p id="message" role="status"></p>
    <small>MADE WITH LOVE ♡</small>
</div>


<script>
const salt = decode64("hn7/B+cJDYPDup6DyIg6Vw==");
const nonce = decode64("At+V+4ovtpPi43SN");

function decode64(value) {
    if (typeof Uint8Array.fromBase64 === "function") {
        return Uint8Array.fromBase64(value);
    }
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
}

document.getElementById("unlockForm")
.addEventListener("submit", async function(event) {
    event.preventDefault();

    const input = document.getElementById("password");
    const message = document.getElementById("message");
    const button = document.getElementById("unlockButton");

    button.disabled = true;
    message.textContent = "正在開啟我們的回憶…";

    try {
        if (!window.crypto || !crypto.subtle) {
            throw new Error("需要安全的 HTTPS 環境");
        }

        const material = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(input.value),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

        const key = await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 600000,
                hash: "SHA-256"
            },
            material,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
        );

        
        const files = ["part_01.bin", "part_02.bin", "part_03.bin", "part_04.bin"];
        const encrypted = new Uint8Array(191524261);
        let offset = 0;

        for (let i = 0; i < files.length; i++) {
            message.textContent =
                "正在載入回憶 " +
                (i + 1) + "/" + files.length + " ♡";

            const response = await fetch(files[i]);

            if (!response.ok) {
                throw new Error("加密檔案載入失敗");
            }

            const chunk = new Uint8Array(
                await response.arrayBuffer()
            );

            encrypted.set(chunk, offset);
            offset += chunk.length;
        }

        if (offset !== encrypted.length) {
            throw new Error("加密資料不完整");
        }

        message.textContent =
            "正在解鎖我們的回憶…";


        const decrypted = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: nonce },
            key,
            encrypted
        );

        const html = new TextDecoder().decode(decrypted);
        input.value = "";

        document.open();
        document.write(html);
        document.close();

    } catch (error) {
        message.textContent =
            "無法解鎖，請確認密碼或瀏覽器環境後再試一次 ♡";
        button.disabled = false;
    }
});
</script>
</body>
</html>
