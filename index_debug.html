
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>芸 My Princess ♡</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fff7ef, #ecd3d7);
    font-family: sans-serif;
    color: #a86c7c;
    padding: 24px;
}
.card {
    width: 100%;
    max-width: 360px;
    background: #fff9f6;
    border-radius: 28px;
    padding: 36px 24px;
    text-align: center;
    box-shadow: 0 15px 45px #b7858e33;
}
h1 { font-size: 30px; }
p { line-height: 1.8; }
input {
    width: 100%;
    padding: 15px;
    border: 1px solid #dfb8c1;
    border-radius: 14px;
    font-size: 16px;
    background: white;
    margin: 15px 0;
}
button {
    width: 100%;
    border: none;
    border-radius: 30px;
    padding: 15px;
    background: #bc8191;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
button:disabled { opacity: .6; }
#message {
    font-size: 14px;
    min-height: 24px;
}
.progress {
    height: 8px;
    background: #ecd3d7;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 20px;
}
#bar {
    height: 100%;
    width: 0%;
    background: #bc8191;
    transition: width .3s;
}
#debug {
    font-size: 12px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.7;
    background: #f8efed;
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
}
</style>
</head>
<body>
<div class="card">
    <div style="font-size:42px">♡</div>
    <h1>芸 My Princess</h1>
    <p>藏在時光裡的我們</p>
    <p>有些回憶，只屬於我們。<br>
    請輸入專屬密碼，開啟幸福日記。</p>

    <form id="unlockForm">
        <input id="password"
            type="password"
            placeholder="請輸入專屬密碼"
            autocomplete="off" required>
        <button id="unlockButton" type="submit">
            開啟我們的回憶 ♡
        </button>
    </form>

    <div class="progress">
        <div id="bar"></div>
    </div>
    <p id="message" role="status"></p>
    <div id="debug">診斷版本 V1：等待登入</div>
    <small>MADE WITH LOVE ♡</small>
</div>

<script>
const salt = decode64("hn7/B+cJDYPDup6DyIg6Vw==");
const nonce = decode64("At+V+4ovtpPi43SN");

function decode64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
}

const message = document.getElementById("message");
const debug = document.getElementById("debug");
const bar = document.getElementById("bar");

let stage = "等待登入";

function log(text) {
    debug.textContent += "\n" + text;
}

async function update(text, percent) {
    stage = text;
    message.textContent = text;
    bar.style.width = percent + "%";
    log(text);
    await new Promise(resolve => setTimeout(resolve, 100));
}

document.getElementById("unlockForm")
.addEventListener("submit", async function(event) {
    event.preventDefault();

    const input = document.getElementById("password");
    const button = document.getElementById("unlockButton");

    button.disabled = true;
    debug.textContent = "開始診斷";
    bar.style.width = "0%";

    try {
        await update("1. 檢查瀏覽器環境", 5);

        if (!window.crypto || !crypto.subtle) {
            throw new Error("Web Crypto API 不可使用");
        }

        await update("2. 建立密碼金鑰", 10);

        const material = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(input.value),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

        const key = await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 600000,
                hash: "SHA-256"
            },
            material,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
        );

        log("金鑰建立完成");

        await update("3. 配置記憶體空間", 15);

        const files = [
            "part_01.bin",
            "part_02.bin",
            "part_03.bin",
            "part_04.bin"
        ];

        let encrypted = new Uint8Array(191524261);
        let offset = 0;

        log("記憶體配置完成");

        for (let i = 0; i < files.length; i++) {

            await update(
                "4. 下載加密資料 " + (i + 1) + "/4",
                20 + i * 12
            );

            const response = await fetch(files[i], {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(
                    files[i] + " HTTP " + response.status
                );
            }

            const chunk = new Uint8Array(
                await response.arrayBuffer()
            );

            encrypted.set(chunk, offset);
            offset += chunk.length;

            log(
                files[i] + " 完成：" +
                (chunk.length / 1048576).toFixed(2) +
                " MiB"
            );
        }

        await update("5. 檢查資料長度", 70);

        if (offset !== encrypted.length) {
            throw new Error(
                "資料長度不符：" + offset +
                " / " + encrypted.length
            );
        }

        await update("6. AES-GCM 解密中", 80);

        let decrypted = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: nonce },
            key,
            encrypted
        );

        encrypted = null;
        log("AES-GCM 解密成功");

        await update("7. 轉換 HTML 內容", 90);

        const html = new TextDecoder().decode(decrypted);
        decrypted = null;
        input.value = "";

        await update("8. 初始化網站畫面", 100);

        document.open();
        document.write(html);
        document.close();

    } catch (error) {
        message.textContent = "解鎖失敗";
        log("----------------");
        log("失敗階段：" + stage);
        log("錯誤名稱：" + error.name);
        log("錯誤原因：" + error.message);
        button.disabled = false;
    }
});
</script>
</body>
</html>
